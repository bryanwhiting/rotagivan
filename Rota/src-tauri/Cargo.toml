[package]
name = "rota"
version = "0.1.2"
description = "Rota trackpad control and spatial HUD"
authors = ["Rota"]
edition = "2021"

[lib]
name = "rota_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
axum = "0.8"
json-patch = "3"
rmcp = { version = "3.4.1", features = ["transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
tokio-util = "0.7"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
